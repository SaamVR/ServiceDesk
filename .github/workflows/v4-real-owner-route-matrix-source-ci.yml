name: ServiceDesk V4 real-owner thirteen-module gate SOURCE QA
on:
  push:
    branches: [feat/servicedesk-v4-authenticated-13-page-uat-20261012]
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@v4
        with: {version: 10.17.1, run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.2, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: Check strict no-false-auth and 91-route private Chromium UAT script
        run: node --check scripts/release/v4-authenticated-sidebar-chrome.mjs
      - name: Contract tests for actual owner acceptance gate
        run: pnpm exec vitest run tests/e2e/v4-authenticated-13-route-acceptance-contract.test.ts tests/e2e/v4-studio-sidebar-visibility.test.ts tests/e2e/v3-authorized-workspace-access.test.ts tests/e2e/staff-v3-navigation.test.tsx
      - name: Full source/production release check, no protected account
        run: pnpm check:rc
