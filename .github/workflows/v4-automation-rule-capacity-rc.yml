name: ServiceDesk V4 scalable rule capacity RC
on:
  push:
    branches: [feat/v4-automation-rule-capacity-20261012]
  pull_request:
    branches: [feat/servicedesk-v4-reconciled-qa-shell-20261012]
    paths:
      - ".github/workflows/v4-automation-rule-capacity-rc.yml"
      - "src/server/workflows/**"
      - "src/server/jobs/outbox-worker.ts"
      - "src/contracts/workflow*.ts"
      - "supabase/migrations/*workflow*.sql"
      - "src/features/operations/owner-automation-*.ts"
      - "tests/db/v4-*automation*.test.ts"
      - "tests/e2e/v4-cleaning-automation-playbooks.test.ts"
permissions:
  contents: read
concurrency:
  group: v4-rule-capacity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  full-rc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.2, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/db/v4-automation-rule-capacity.test.ts
      - name: Full source check on owned feature branch (PRs use central exact-head RC)
        if: github.event_name == 'push'
        run: pnpm check:rc
