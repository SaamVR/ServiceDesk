name: ServiceDesk P41 owner attention timestamp integrity source QA
on:
  push:
    branches: [sonic-p03/p41-attention-zoned-deadline-integrity-20261029]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: servicedesk-p41-${{ github.ref }}
  cancel-in-progress: true
jobs:
  strict-attention-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused strict clock, original attention triage, quote clock parser
        run: pnpm exec vitest run tests/e2e/v4-p41-owner-attention-zoned-clock.test.ts tests/e2e/v4-p33-owner-attention-triage.test.ts tests/e2e/v4-p38-quote-pipeline-zoned-clock.test.ts
      - run: pnpm typecheck
