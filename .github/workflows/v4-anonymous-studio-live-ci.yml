name: ServiceDesk V4 read-only live anonymous Studio route isolation
on:
  push:
    branches: [feat/servicedesk-v4-auth-guest-route-proof-20261012]
    paths:
      - scripts/release/v4-anonymous-studio-browser.mjs
      - .github/workflows/v4-anonymous-studio-live-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  anonymous-denial:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.2}
      - name: Verify browser audit syntax
        run: node --check scripts/release/v4-anonymous-studio-browser.mjs
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: All 13 live protected Studio modules, seven widths, AI CSRF and no-session calls
        env:
          V4_ANON_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          V4_ANON_OUTPUT: ${{ runner.temp }}/v4-anonymous-denials
          V4_ANON_ORIGIN: https://servicedesk-v3-frontend-review.onrender.com
        run: node scripts/release/v4-anonymous-studio-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-anonymous-denials-${{ github.sha }}
          path: ${{ runner.temp }}/v4-anonymous-denials/
          retention-days: 4
          if-no-files-found: warn
