name: ServiceDesk P36 integrated pricing and owner playbook source CI
on:
  push:
    branches: ["sonic-p03/p36-integrated-owner-pricing-playbooks-20261029"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: servicedesk-p36-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reviewed-composite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exact Git-object source critic and owner negative tests
        run: pnpm exec vitest run tests/e2e/v4-p36-exact-source-critic.test.ts tests/e2e/v4-p35-owner-pricing-revision-scope.test.ts tests/e2e/v4-p35-owner-automation-draft-recommendations.test.ts tests/e2e/v4-p34-exact-source-and-security-critic.test.ts
      - name: Complete integrated source RC
        run: pnpm check:rc
