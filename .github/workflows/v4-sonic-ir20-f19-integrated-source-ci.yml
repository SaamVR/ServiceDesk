name: ServiceDesk IR20 selected Quality and Quote recovery
on:
  push:
    branches: ["sonic-integration/ir20-f19-authoritative-recovery-20261030"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: servicedesk-ir20-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-integrated-owner-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Targeted owner feature and exact historical successor gate
        run: >-
          pnpm exec vitest run
          tests/ai/f19-quality-case-followthrough.test.ts
          tests/ai/f19-quote-deep-recovery.test.ts
          tests/ai/f19-independent-risk-critic.test.ts
          tests/ai/f19-ir20-source-critic.test.ts
          tests/ai/f17-quote-recovery-ui.test.ts
          tests/ai/f17-ir18-multilane-critic.test.ts
      - name: TypeScript
        run: pnpm typecheck
      - name: Changed-source ESLint
        run: >-
          pnpm exec eslint
          src/features/operations/f19-quality-case-guidance.ts
          src/features/operations/QualityCaseFollowthroughPanel.tsx
          src/features/operations/f19-quote-recovery-targets.ts
          src/features/operations/QuoteRecoveryReadinessPanel.tsx
          src/app/app/\[workspace\]/quality/page.tsx
          tests/ai/f19-quality-case-followthrough.test.ts
          tests/ai/f19-quote-deep-recovery.test.ts
          tests/ai/f19-independent-risk-critic.test.ts
          tests/ai/f19-ir20-source-critic.test.ts
          tests/ai/f17-quote-recovery-ui.test.ts
          tests/ai/f17-ir18-multilane-critic.test.ts
      - name: Source-only Next build, no deployments
        run: pnpm build
