name: ServiceDesk V4 Clean Air Sandbox QA

# Review-only data. No database, auth session, payment, email or provider action.
on:
  push:
    branches:
      - feat/servicedesk-v4-sandbox-clean-air-20261011
    paths:
      - "src/features/sandbox/**"
      - "tests/e2e/v4-sandbox-clean-air.test.ts"
      - ".github/workflows/v4-sandbox-clean-air-rc.yml"
  pull_request:
    branches:
      - deploy/servicedesk-v3-public-review-20261011
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/features/sandbox/**"
      - "tests/e2e/v4-sandbox-clean-air.test.ts"
      - ".github/workflows/v4-sandbox-clean-air-rc.yml"

permissions:
  contents: read

jobs:
  clean-air-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Pricing, simulation and V4 UI contract tests
        run: pnpm exec vitest run tests/e2e/v3-sandbox-workflow.test.ts tests/e2e/v4-sandbox-clean-air.test.ts
      - name: TypeScript and targeted lint
        run: |
          pnpm typecheck
          pnpm exec eslint src/features/sandbox/ tests/e2e/v4-sandbox-clean-air.test.ts
      - name: Next.js production build
        run: pnpm build
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
      - name: Boot local read-only sandbox
        shell: bash
        run: |
          pnpm start -H 127.0.0.1 -p 3000 > "$RUNNER_TEMP/servicedesk-v4-sandbox.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/sandbox > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "V4 sandbox did not boot"
          exit 1
      - name: Execute genuine synthetic eight-step Chrome interactions
        env:
          V3_SANDBOX_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          V3_SANDBOX_OUTPUT: ${{ runner.temp }}/servicedesk-v4-sandbox-proof
        run: node scripts/release/v3-sandbox-browser.mjs
      - name: Upload synthetic visual screenshots and ledger manifest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v4-clean-air-sandbox-chrome
          path: ${{ runner.temp }}/servicedesk-v4-sandbox-proof/
          retention-days: 7
          if-no-files-found: error
