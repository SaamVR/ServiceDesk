name: ServiceDesk V4 real tenant quoting RC
on:
  push:
    branches: [fix/v4-tenant-priced-quote-20261012]
  pull_request:
    branches: [feat/servicedesk-v4-reconciled-qa-shell-20261012]
    paths:
      - src/server/core/operational-quote-rate-card.ts
      - src/server/core/request-quote-capacity-postgres.ts
      - src/features/operations/operational-product-runtime.ts
      - tests/db/v4-operational-quote-rate-card.test.ts
      - .github/workflows/v4-tenant-priced-quote-rc.yml
permissions:
  contents: read
concurrency:
  group: sd-v4-tenant-pricing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  exact-head-rc:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.2, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Real tenant price book and zero fallback regression
        run: pnpm exec vitest run tests/db/v4-operational-quote-rate-card.test.ts
      - name: Full source, types, lint and production build
        run: pnpm check:rc
