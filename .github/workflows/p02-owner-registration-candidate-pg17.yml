name: P02 registration DB authorization candidate - disposable PG17 proof
# SOURCE ONLY, no live Supabase connection and no ServiceDesk deploy
on:
  pull_request:
    branches: [feat/servicedesk-v4-reconciled-qa-shell-20261012]
    paths:
      - "docs/engineering/security/p02-owner-registration-db-authorization-candidate.sql"
      - "docs/delivery/sonic-gap/p02-registration-guard-owner-approval-checklist-20261026.md"
      - "tests/sql/p02-owner-registration-db-authorization-pg17.sql"
      - "tests/db/p02-owner-registration-db-authorization-candidate.test.ts"
      - ".github/workflows/p02-owner-registration-candidate-pg17.yml"
permissions:
  contents: read
concurrency:
  group: sd-p02-registration-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  exact-head-disposable-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-p02-registration-only
          POSTGRES_DB: servicedesk_p02_registration_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d servicedesk_p02_registration_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: PostgreSQL17 disposable A/B owner authorization proof
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: servicedesk_p02_registration_test
          PGPASSWORD: disposable-p02-registration-only
        run: |
          command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
          psql -v ON_ERROR_STOP=1 -f tests/sql/p02-owner-registration-db-authorization-pg17.sql
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Candidate integrity and fail-closed contract
        run: pnpm exec vitest run tests/db/p02-owner-registration-db-authorization-candidate.test.ts
