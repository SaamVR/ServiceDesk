name: ServiceDesk V4 AI Request persisted schema RC
on:
  push:
    branches: [fix/v4-ai-request-schema-20261012]
  pull_request:
    branches: [feat/servicedesk-v4-reconciled-qa-shell-20261012]
    paths:
      - "src/server/ai/request-brief.ts"
      - "tests/e2e/v4-ai-request-copilot.test.ts"
      - ".github/workflows/v4-ai-request-schema-rc.yml"
permissions:
  contents: read
concurrency:
  group: v4-ai-request-schema-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  request-schema-rc:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.2, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Real persisted request schema and AI privacy regression
        run: pnpm exec vitest run tests/e2e/v4-ai-request-copilot.test.ts
      - name: Complete type, unit, lint and build gate
        run: pnpm check:rc
