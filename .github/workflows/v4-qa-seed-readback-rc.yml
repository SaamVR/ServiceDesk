name: ServiceDesk V4 QA persistence acceptance
on:
  push:
    branches:
      - fix/v4-qa-seed-readback-20261012
  pull_request:
    branches:
      - feat/servicedesk-v4-reconciled-qa-shell-20261012
    paths:
      - "src/features/auth/qa-sample-seed.ts"
      - "tests/e2e/v3-qa-synthetic-persistence.test.ts"
      - ".github/workflows/v4-qa-seed-readback-rc.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: servicedesk-v4-qa-readback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  exact-head-rc:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.2, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Full exact-head source and build RC
        run: pnpm check:rc
