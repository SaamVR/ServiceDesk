name: ServiceDesk V4 QA seed service-link RC
on:
  push:
    branches: [fix/v4-qa-saved-request-service-20261012]
  pull_request:
    branches: [feat/servicedesk-v4-reconciled-qa-shell-20261012]
    paths:
      - "src/features/auth/qa-sample-seed.ts"
      - "tests/e2e/v3-qa-synthetic-persistence.test.ts"
      - ".github/workflows/v4-qa-seed-service-link-rc.yml"
permissions:
  contents: read
concurrency:
  group: sd-qa-service-link-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qa-owner-proof:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.2, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Authenticated QA persistence and real service foreign-key checks
        run: pnpm exec vitest run tests/e2e/v3-qa-synthetic-persistence.test.ts
      - run: pnpm check:rc
