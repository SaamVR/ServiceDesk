name: ServiceDesk V4 AI intake output guard release check
on:
  push:
    branches: [feat/servicedesk-v4-ai-brief-safety-20261012]
    paths:
      - src/server/ai/request-brief.ts
      - src/server/ai/request-brief-safety.ts
      - tests/e2e/v4-ai-request-copilot.test.ts
      - .github/workflows/v4-ai-output-safety-ci.yml
permissions:
  contents: read
jobs:
  ai-safety-and-product-rc:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@v4
        with: {version: 10.17.1, run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.2, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: Refuse AI hallucinated amounts, contacts and completed actions
        run: pnpm exec vitest run tests/e2e/v4-ai-request-copilot.test.ts
      - name: Full release candidate including build, TypeScript and lint
        run: pnpm check:rc
