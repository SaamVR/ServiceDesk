name: ServiceDesk V4 persisted automation status visible in Studio CI
on:
  push:
    branches: [feat/servicedesk-v4-persisted-automation-proof-ui-20261012]
permissions: {contents: read}
jobs:
  visible-live-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@v4
        with: {version: 10.17.1,run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.2,cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: Verify real persisted action/preview/provider-proof classification
        run: pnpm exec vitest run tests/e2e/v4-persisted-workflow-evidence.test.ts tests/db/v4-owner-request-automation.test.ts
      - name: Full release candidate including tests, lint, types and production build
        run: pnpm check:rc
