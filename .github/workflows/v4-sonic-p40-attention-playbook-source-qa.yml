name: ServiceDesk P40 owner attention review playbook source QA
on:
  push:
    branches:
      - sonic-p03/p40-owner-attention-review-playbook-20261029
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: servicedesk-p40-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Source-level owner attention and adversarial playbook checks
        run: pnpm exec vitest run tests/e2e/v4-p40-owner-attention-review-playbook.test.ts tests/e2e/v4-p33-owner-attention-triage.test.ts tests/e2e/v4-p33-activation-replay-integrity.test.ts
      - name: Full TypeScript check
        run: pnpm typecheck
