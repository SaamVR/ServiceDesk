name: ServiceDesk V4 SQL pricing atomic guard RC
on:
  push:
    branches: [fix/v4-pricing-sql-preflight-20261012]
  pull_request:
    branches: [feat/servicedesk-v4-reconciled-qa-shell-20261012]
    paths:
      - ".github/workflows/v4-pricing-preflight-rc.yml"
      - "supabase/migrations/0061_v4_owner_first_run_pricing.sql"
      - "src/server/core/owner-cleaning-pricing-*.ts"
      - "src/features/operations/OwnerCleaningPricingSetupForm.tsx"
      - "src/features/operations/owner-pricing-readiness.ts"
      - "src/features/operations/verified-owner-price-evidence.ts"
      - "tests/e2e/v4-owner-first-run-pricing.test.ts"
      - "tests/e2e/v4-owner-price-name-readback.test.ts"
permissions:
  contents: read
concurrency:
  group: sd-v4-sql-pricing-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  exact-head-rc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.2, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/e2e/v4-owner-first-run-pricing.test.ts
      - name: Full source check on owned feature branch (PRs use central exact-head RC)
        if: github.event_name == 'push'
        run: pnpm check:rc
