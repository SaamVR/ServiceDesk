name: ServiceDesk V4 canonical PR full source RC
# Exactly one full source/type/lint/build gate per controller-targeted PR.
# Focused domain workflows remain independently required and the controller
# merge still runs full exact-head Chrome/synthetic release checks.
on:
  pull_request:
    branches: [feat/servicedesk-v4-reconciled-qa-shell-20261012]
permissions:
  contents: read
concurrency:
  group: sd-v4-pr-full-rc-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  exact-head-full-source-rc:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Confirm exact pull request source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify fail-closed critic Markdown classifier
        # Old open PR heads may predate this new helper. They run full RC
        # rather than failing a new docs-only check they do not contain.
        if: ${{ hashFiles('scripts/release/tests/critic-docs-only-scope-check.mjs') != '' }}
        run: node --test scripts/release/tests/critic-docs-only-scope-check.mjs
      - name: Classify exact PR merge-base diff
        id: critic_docs_scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f scripts/release/critic-docs-only-scope.mjs ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Old PR head lacks classifier: run complete source RC"
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Base SHA missing: require full source validation"
            exit 0
          fi
          common_base="$(git merge-base "$BASE_SHA" "$EXPECTED_SHA")" || exit 1
          # Do not rename-detect: a deleted runtime file renamed into docs
          # must expose BOTH paths and therefore trigger the full source RC.
          git diff --no-renames --name-only -z "$common_base" "$EXPECTED_SHA" > "$RUNNER_TEMP/sd-pr-changed-paths.bin"
          decision="$(node scripts/release/critic-docs-only-scope.mjs "$RUNNER_TEMP/sd-pr-changed-paths.bin")"
          echo "docs_only=$decision" >> "$GITHUB_OUTPUT"
          if [ "$decision" = "true" ]; then
            echo "Only approved critic Markdown changed; required source gate still passes, full build remains mandatory on canonical push."
          fi
      - name: Fast-path receipt for critic Markdown-only PR
        if: steps.critic_docs_scope.outputs.docs_only == 'true'
        run: |
          test "${{ steps.critic_docs_scope.outputs.docs_only }}" = "true"
          echo "Critic documentation reviewed by mandatory independent Critic gate."
      - uses: pnpm/action-setup@v4
        if: steps.critic_docs_scope.outputs.docs_only != 'true'
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        if: steps.critic_docs_scope.outputs.docs_only != 'true'
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Locked dependencies
        if: steps.critic_docs_scope.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile
      - name: Full unit, integration, TypeScript, lint and production build
        if: steps.critic_docs_scope.outputs.docs_only != 'true'
        run: pnpm check:rc
