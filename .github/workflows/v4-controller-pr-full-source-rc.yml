name: ServiceDesk V4 canonical PR full source RC
# Exactly one full source/type/lint/build gate per controller-targeted PR.
# Focused domain workflows remain independently required and the controller
# merge still runs full exact-head Chrome/synthetic release checks.
on:
  pull_request:
    branches: [feat/servicedesk-v4-reconciled-qa-shell-20261012]
    # Critic-owned reports and ordinary documentation cannot alter runtime
    # behavior. Their dedicated integrity CI remains active, while mixed
    # docs+source PRs still run this complete 35-minute-capable gate.
    paths-ignore:
      - "docs/**"
permissions:
  contents: read
concurrency:
  group: sd-v4-pr-full-rc-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  exact-head-full-source-rc:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirm exact pull request source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Full unit, integration, TypeScript, lint and production build
        run: pnpm check:rc
