name: ServiceDesk P33 owner attention triage
on:
  push:
    branches: ["sonic-p03/p33-owner-attention-triage-20261029"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused owner automation tests
        run: pnpm exec vitest run tests/e2e/v4-p33-owner-attention-triage.test.ts tests/e2e/v4-owner-automation-activation.test.ts
      - name: TypeScript check
        run: pnpm typecheck
      - name: Changed-file lint
        run: pnpm exec eslint src/features/operations/owner-attention-triage.ts src/features/operations/OwnerAutomationActivationChecklist.tsx tests/e2e/v4-p33-owner-attention-triage.test.ts
