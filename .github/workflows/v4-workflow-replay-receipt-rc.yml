name: ServiceDesk V4 owner automation replay receipt accuracy RC
on:
  push:
    branches: [feat/servicedesk-v4-workflow-replay-truth-20261012]
permissions: {contents: read}
jobs:
  verified-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@v4
        with: {version: 10.17.1,run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.2,cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: Immutable source identity and saved-rule new-vs-duplicate receipts
        run: pnpm exec vitest run tests/db/v4-owner-request-automation.test.ts tests/domain/v2-workflow-engine.test.ts tests/e2e/v4-request-workflow-owner-action.test.ts
      - name: Full product release check
        run: pnpm check:rc
