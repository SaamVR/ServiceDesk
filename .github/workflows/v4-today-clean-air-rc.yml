name: ServiceDesk V4 Today Visual RC

# Visual-only authenticated-shell CSS check. No credentials, real tenant or DB.
on:
  push:
    branches:
      - feat/servicedesk-v4-today-clean-air-20261011
    paths:
      - ".github/workflows/v4-today-clean-air-rc.yml"
      - "src/features/operations/StaffOverviewDashboard.module.css"
      - "tests/e2e/v4-today-clean-air.test.ts"
  pull_request:
    branches:
      - feat/servicedesk-v4-full-visual-candidate-20261011
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/v4-today-clean-air-rc.yml"
      - "src/features/operations/StaffOverviewDashboard.module.css"
      - "tests/e2e/v4-today-clean-air.test.ts"

permissions:
  contents: read
jobs:
  today-design-rc:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: CSS integrity and true-dashboard static UI contract
        run: pnpm exec vitest run tests/e2e/v4-today-clean-air.test.ts
      - name: Full Next.js release gate
        run: pnpm check:rc
