name: V4 real guest AI HTTP isolated acceptance
on:
  pull_request:
    branches: [feat/servicedesk-v4-reconciled-qa-shell-20261012]
    paths:
      - .github/workflows/v4-real-guest-ai-http-repro.yml
      - scripts/release/v4-studio-guest-release-contract.mjs
      - src/server/api-handlers/ai-staff-http.ts
  push:
    branches: [ci/v4-real-guest-ai-join-smoke-20261013]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v4-guest-ai-repro-${{ github.ref }}
  cancel-in-progress: true
jobs:
  built-next-guest-http:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      V4_GUEST_ROUTE_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact candidate
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build actual Next production app
        run: pnpm build
      - name: Launch real app on loopback
        run: |
          pnpm start -H 127.0.0.1 -p 3000 > "$RUNNER_TEMP/guest-ai-next.log" 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          echo 'ServiceDesk Next app did not start'; exit 1
      - name: Verify anonymous built-Next AI denial policy
        run: node scripts/release/v4-studio-guest-release-contract.mjs
      - name: Show source-safe server diagnostics only on failure
        if: failure()
        run: |
          echo 'Last server startup/status lines (never request logs)'
          grep -E 'Ready in|Error|error|listen' "$RUNNER_TEMP/guest-ai-next.log" | tail -15 || true
