name: ServiceDesk V4 owner pricing branch readiness RC
on:
  push:
    branches: [fix/v4-owner-pricing-branch-readiness-20261012]
  pull_request:
    branches: [feat/servicedesk-v4-reconciled-qa-shell-20261012]
    # Universal exact PR-head source RC remains unfiltered; this expensive
    # specialist gate runs only for code it actually owns.
    paths:
      - "src/features/operations/owner-pricing-readiness.ts"
      - "src/features/operations/OwnerCleaningPricing*"
      - "src/server/core/owner-cleaning-pricing-*"
      - "src/app/app/[workspace]/settings/**"
      - "supabase/migrations/0061*"
      - "supabase/migrations/0062*"
      - "tests/e2e/v4-owner-branch-price-readiness.test.ts"
      - "tests/e2e/v4-owner-first-run-pricing.test.ts"
      - "tests/e2e/v4-owner-pricing-worksheet.test.ts"
      - ".github/workflows/v4-pricing-branch-readiness-rc.yml"
permissions:
  contents: read
concurrency:
  group: sd-v4-owner-branch-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  exact-head-rc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.2, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/e2e/v4-owner-branch-price-readiness.test.ts
      - name: Full source check on owned feature branch (PRs use central exact-head RC)
        if: github.event_name == 'push'
        run: pnpm check:rc
