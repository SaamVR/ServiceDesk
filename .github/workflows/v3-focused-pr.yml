name: ServiceDesk V3 focused PR safety

# Narrow validation only. Complete RC and browser acceptance remain owned by
# GPT Runtime, not by a recurring CI job or real provider credentials.
on:
  # Exactly one complete acceptance run after substantive backend integration,
  # on the combined coordinator SHA. Documentation-only pushes do not retrigger.
  push:
    branches:
      - feat/servicedesk-v3-coordination-20261011
    paths:
      - "src/server/jobs/**"
      - "src/server/integrations/recovery/**"
      - "src/server/integrations/outbox/**"
      - "src/server/ai/**"
      - "src/domain/auth/**"
      - "tests/db/outbox*.test.ts"
      - "tests/providers/provider-recovery*.test.ts"
      - "tests/providers/ai*.test.ts"
      - "vitest.config.ts"
      - ".github/workflows/v3-focused-pr.yml"
  pull_request:
    branches:
      - feat/servicedesk-v3-coordination-20261011
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/domain/auth/authorized-workspace-selection.ts"
      - "tests/domain/authorized-workspace-selection.test.ts"
      - "src/server/integrations/email/transport.ts"
      - "tests/providers/resend-transactional-email-contract.test.ts"
      - "src/server/ai/tool-orchestration.ts"
      - "tests/providers/ai-tool-orchestration.test.ts"
      - "src/server/integrations/outbox/dispatch-router.ts"
      - "tests/providers/outbox-dispatch-router.test.ts"
      - "src/server/jobs/outbox-worker.ts"
      - "src/server/jobs/outbox-retry.ts"
      - "tests/db/outbox-worker.test.ts"
      - "src/server/integrations/recovery/lease.ts"
      - "src/server/integrations/recovery/scheduler.ts"
      - "tests/providers/provider-recovery-lease.test.ts"
      - "tests/providers/provider-recovery-scheduler.test.ts"
      - "src/server/jobs/outbox-repository.ts"
      - "tests/db/outbox-postgres-gateway.test.ts"
      - "src/server/integrations/recovery/serialization.ts"
      - "tests/providers/provider-recovery-serialization.test.ts"
      - "src/server/ai/model-transport.ts"
      - "tests/providers/ai-model-transport-hardening.test.ts"
      - "src/server/ai/configured-service.ts"
      - "src/server/ai/index.ts"
      - "tests/providers/ai-configured-service.test.ts"
      - "src/server/ai/fetch-transport.ts"
      - "src/server/ai/runtime-config.ts"
      - "tests/providers/ai-fetch-runtime.test.ts"
      - "src/server/ai/operational-runtime.ts"
      - "src/server/ai/staff-invocation.ts"
      - "src/server/api-handlers/ai-staff-http.ts"
      - "tests/e2e/v3-ai-staff-http.test.ts"
      - "src/server/ai/catalog-knowledge.ts"
      - "tests/providers/ai-staff-invocation.test.ts"
      - "tests/providers/ai-catalog-knowledge.test.ts"
      - "tests/providers/ai-operational-runtime.test.ts"
      - "src/server/ai/postgres-conversation-store.ts"
      - "src/server/ai/postgres-configured-service.ts"
      - "tests/db/v3-ai-durable-conversation-store.test.ts"
      - "tests/providers/ai-postgres-configured-service.test.ts"
      - "src/server/api-handlers/provider-whatsapp-runtime.ts"
      - "src/server/api-handlers/provider-whatsapp-http.ts"
      - "tests/e2e/v3-whatsapp-http-boundary.test.ts"
      - "src/server/integrations/whatsapp/adapter.ts"
      - "src/server/integrations/whatsapp/status-postgres.ts"
      - "tests/providers/whatsapp-status-postgres.test.ts"
      - "src/server/integrations/whatsapp/inbound-config.ts"
      - "tests/providers/whatsapp-runtime-inbound.test.ts"
      - "src/server/core/conversation-postgres.ts"
      - "src/server/api-handlers/provider-whatsapp.ts"
      - "tests/db/v3-inbound-rpc-scope.test.ts"
      - "tests/providers/whatsapp-handler-hardening.test.ts"
      - "scripts/release/v3-staging-auth-smoke.mjs"
      - "scripts/release/v3-staging-auth-smoke.test.mjs"
      - ".github/workflows/v3-focused-pr.yml"

permissions:
  contents: read

concurrency:
  group: servicedesk-v3-focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-contracts-and-rc:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release smoke safety
        run: node --test scripts/release/v3-staging-auth-smoke.test.mjs
      - name: Focused provider, outbox and recovery regression
        run: >-
          pnpm exec vitest run
          tests/domain/authorized-workspace-selection.test.ts
          tests/providers/resend-transactional-email-contract.test.ts
          tests/providers/ai-tool-orchestration.test.ts
          tests/providers/outbox-dispatch-router.test.ts
          tests/db/outbox-worker.test.ts
          tests/providers/provider-recovery-lease.test.ts
          tests/providers/provider-recovery-scheduler.test.ts
          tests/db/outbox-postgres-gateway.test.ts
          tests/providers/provider-recovery-serialization.test.ts
          tests/providers/ai-model-transport-hardening.test.ts
          tests/providers/ai-configured-service.test.ts
          tests/providers/ai-fetch-runtime.test.ts
          tests/providers/ai-operational-runtime.test.ts
          tests/providers/ai-staff-invocation.test.ts
          tests/e2e/v3-ai-staff-http.test.ts
          tests/providers/ai-catalog-knowledge.test.ts
          tests/db/v3-ai-durable-conversation-store.test.ts
          tests/providers/ai-postgres-configured-service.test.ts
          tests/providers/whatsapp-runtime-inbound.test.ts
          tests/providers/whatsapp-status-postgres.test.ts
          tests/e2e/v3-whatsapp-http-boundary.test.ts
          tests/db/v3-inbound-rpc-scope.test.ts
          tests/providers/whatsapp-handler-hardening.test.ts
          tests/db/outbox-worker.test.ts
      - name: Complete repository RC gate (typecheck, all tests, lint, Next build)
        run: pnpm check:rc
