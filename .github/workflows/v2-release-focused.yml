name: ServiceDesk focused product integrity

# One low-cost PR check for release-gate changes. The existing Render RC
# already runs the full suite/build on integrated candidates.
on:
  pull_request:
    branches:
      - feat/servicedesk-v2-multilane-20261006
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/v2-release-focused.yml"
      - "src/server/release/**"
      - "src/features/operations/release-readiness-runtime.ts"
      - "tests/providers/v2-release-readiness-registry.test.ts"
      - "tests/e2e/v2-release-readiness-runtime.test.ts"
      - "tests/e2e/v2-release-health-readiness.test.ts"
      - "render.yaml"
      - "src/server/integrations/whatsapp/inbound-processor.ts"
      - "src/server/integrations/whatsapp/inbox-persistence.ts"
      - "tests/providers/whatsapp-inbound-processor.test.ts"
      - "tests/providers/whatsapp-inbound-batch.test.ts"
      - "tests/providers/whatsapp-durable-inbound-handler.test.ts"
      - "src/components/product/StaffAppShell.tsx"
      - "src/components/product/StaffWorkspaceV3.module.css"
      - "src/features/operations/StaffOverviewDashboard.module.css"
      - "tests/e2e/staff-v3-navigation.test.tsx"
      - "src/features/auth/registration.ts"
      - "src/features/auth/RegistrationShell.tsx"
      - "src/features/auth/RegistrationShell.module.css"
      - "src/features/onboarding/OnboardingProductRoute.tsx"
      - "src/app/auth/**"
      - "src/app/page.tsx"
      - "src/components/shell/MarketingShell.tsx"
      - "src/components/shell/MarketingNavV3.module.css"
      - "supabase/migrations/0059_v3_verified_owner_workspace_bootstrap.sql"
      - "tests/e2e/v3-owner-registration-flow.test.tsx"

permissions:
  contents: read

concurrency:
  group: v2-release-focused-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  focused-integrity:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Focused release regression
        run: >-
          pnpm exec vitest run
          tests/providers/v2-release-readiness-registry.test.ts
          tests/e2e/v2-release-readiness-runtime.test.ts
          tests/e2e/v2-release-health-readiness.test.ts
          tests/providers/whatsapp-inbound-processor.test.ts
          tests/providers/whatsapp-inbound-batch.test.ts
          tests/providers/whatsapp-durable-inbound-handler.test.ts
          tests/e2e/staff-v3-navigation.test.tsx
          tests/e2e/v3-owner-registration-flow.test.tsx
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint changed release files
        run: >-
          pnpm exec eslint
          src/server/release/v2-release-readiness.ts
          src/features/operations/release-readiness-runtime.ts
          tests/providers/v2-release-readiness-registry.test.ts
          tests/e2e/v2-release-readiness-runtime.test.ts
          tests/e2e/v2-release-health-readiness.test.ts
          src/server/integrations/whatsapp/inbound-processor.ts
          src/server/integrations/whatsapp/inbox-persistence.ts
          tests/providers/whatsapp-inbound-processor.test.ts
          tests/providers/whatsapp-inbound-batch.test.ts
          tests/providers/whatsapp-durable-inbound-handler.test.ts
          src/components/product/StaffAppShell.tsx
          tests/e2e/staff-v3-navigation.test.tsx
          tests/e2e/v3-owner-registration-flow.test.tsx
          src/features/auth/registration.ts
          src/features/auth/RegistrationShell.tsx
          src/app/auth/sign-up/actions.ts
          src/app/auth/sign-up/page.tsx
          src/app/auth/sign-up/check-email/page.tsx
          src/app/auth/confirm/route.ts
          src/app/auth/continue/route.ts
          src/app/auth/create-workspace/actions.ts
          src/app/auth/create-workspace/page.tsx
          src/app/auth/sign-in/page.tsx
          src/features/onboarding/OnboardingProductRoute.tsx
          src/components/shell/MarketingShell.tsx
