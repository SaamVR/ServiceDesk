name: ServiceDesk V4 27 automation playbooks RC
on:
  push:
    branches: [feat/v4-automation-playbook-catalog-20261012]
  pull_request:
    branches: [feat/servicedesk-v4-reconciled-qa-shell-20261012]
permissions:
  contents: read
concurrency:
  group: v4-automation-27-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  exact-head-rc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.2, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: 27 safe playbooks event/condition/action regression
        run: pnpm exec vitest run tests/e2e/v4-cleaning-automation-playbooks.test.ts
      - run: pnpm check:rc
