name: ServiceDesk IR17 verified branch quote UI
on:
  push:
    branches: ["sonic-integration/ir17-f16-real-quote-review-20261030"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: servicedesk-ir17-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quote-journey-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Only new and impacted quote/workbench tests
        run: >-
          pnpm exec vitest run
          tests/ai/f16-grounded-quote-wire.test.ts
          tests/ai/f16-integrated-ai-studio-critic.test.ts
          tests/ai/f15-ai-studio-wiring.test.ts
      - run: pnpm typecheck
      - name: Changed-file lint
        run: >-
          pnpm exec eslint
          src/features/operations/f16-grounded-quote-review-action.ts
          src/features/operations/AiGroundedQuoteAlternatives.tsx
          src/features/operations/AiStudioWorkbench.tsx
          tests/ai/f16-grounded-quote-wire.test.ts
          tests/ai/f16-integrated-ai-studio-critic.test.ts
          tests/ai/f15-ai-studio-wiring.test.ts
      - name: Next source build only; never deploy
        run: pnpm build
