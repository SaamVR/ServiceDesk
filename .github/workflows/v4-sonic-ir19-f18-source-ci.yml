name: ServiceDesk IR19 consent-checked owner Inbox
on:
  push:
    branches: ["sonic-integration/ir19-f18-consented-inbox-owner-20261030"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: servicedesk-ir19-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inbox-feature-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: New Inbox functional denial and exact-source tests only
        run: >-
          pnpm exec vitest run
          tests/ai/f18-consented-inbox-draft.test.ts
          tests/ai/f18-ir19-critic.test.ts
      - run: pnpm typecheck
      - name: Changed-file lint
        run: >-
          pnpm exec eslint
          src/features/operations/f18-consented-reply-action.ts
          src/features/operations/AiConsentedInboxDraft.tsx
          src/features/operations/InboxConsentedDraftPanel.tsx
          src/app/app/\[workspace\]/inbox/page.tsx
          tests/ai/f18-consented-inbox-draft.test.ts
          tests/ai/f18-ir19-critic.test.ts
      - name: Compile application only; no Vercel preview or deployment
        run: pnpm build
