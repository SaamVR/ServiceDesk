name: ServiceDesk V4 authenticated workspace UAT
# Push checks are source-only. Manual UAT signs in with a fictional QA account
# on the designated review service. Never logs secrets, cookies, tokens or PII.
on:
  push:
    branches: [feat/servicedesk-v4-l4-e2e-20261012, feat/servicedesk-v4-real-auth-uat-20261012, feat/servicedesk-v4-protected-qa-preflight-20261012]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: servicedesk-v4-authenticated-uat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.2, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Validate private Auth Chrome UAT script
        run: node --check scripts/release/v4-authenticated-sidebar-chrome.mjs
      - name: Validate signed-in auth, staff nav and bounded QA operations
        run: pnpm exec vitest run tests/e2e/v3-owner-first-login.test.ts tests/e2e/v3-authorized-workspace-access.test.ts tests/e2e/v3-qa-operations-rls-fallback.test.ts tests/e2e/v3-qa-synthetic-persistence.test.ts tests/e2e/staff-v3-navigation.test.tsx tests/e2e/v4-studio-sidebar-visibility.test.ts
      - run: pnpm typecheck
      - run: node --check scripts/release/v4-protected-qa-preflight.mjs
  authenticated-seven-widths:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'feat/servicedesk-v4-real-auth-uat-20261012'
    runs-on: ubuntu-latest
    needs: source-preflight
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.2, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Verify protected fictional QA secrets before expensive build or network checks
        env:
          SERVICEDESK_QA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SERVICEDESK_QA_SUPABASE_PUBLISHABLE_KEY }}
          SERVICEDESK_QA_TEST_EMAIL: ${{ secrets.SERVICEDESK_QA_TEST_EMAIL }}
          SERVICEDESK_QA_TEST_PASSWORD: ${{ secrets.SERVICEDESK_QA_TEST_PASSWORD }}
          SERVICEDESK_QA_TEST_WORKSPACE: ${{ secrets.SERVICEDESK_QA_TEST_WORKSPACE }}
        run: node scripts/release/v4-protected-qa-preflight.mjs studio-owner
      - name: Build real protected staff routes at exact commit with QA-only RLS
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://cpmmgivhlkfbiwzhlcey.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SERVICEDESK_QA_SUPABASE_PUBLISHABLE_KEY }}
          SERVICEDESK_OWNER_REGISTRATION_QA_ENABLED: "true"
          SERVICEDESK_OPERATIONS_RLS_PREVIEW_ENABLED: "true"
          SERVICEDESK_OWNER_REGISTRATION_ENABLED: "false"
          SERVICEDESK_OWNER_REGISTRATION_QA_EMAILS: ${{ secrets.SERVICEDESK_QA_TEST_EMAIL }}
          SERVICEDESK_AUTH_REDIRECT_ORIGIN: https://servicedesk-v3-frontend-review.onrender.com
        run: pnpm build
      - name: Start isolated Next QA server (no live provider secrets)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://cpmmgivhlkfbiwzhlcey.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SERVICEDESK_QA_SUPABASE_PUBLISHABLE_KEY }}
          SERVICEDESK_OWNER_REGISTRATION_QA_ENABLED: "true"
          SERVICEDESK_OPERATIONS_RLS_PREVIEW_ENABLED: "true"
          SERVICEDESK_OWNER_REGISTRATION_ENABLED: "false"
          SERVICEDESK_OWNER_REGISTRATION_QA_EMAILS: ${{ secrets.SERVICEDESK_QA_TEST_EMAIL }}
          SERVICEDESK_AUTH_REDIRECT_ORIGIN: https://servicedesk-v3-frontend-review.onrender.com
        run: |
          pnpm start -H 127.0.0.1 -p 3000 > "$RUNNER_TEMP/servicedesk-authenticated-qa.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Exact-commit QA app did not boot" >&2
          exit 1
      - name: Install real Chromium
        id: chrome
        uses: browser-actions/setup-chrome@v2
      - name: Validate REAL confirmed owner session and sidebar (no customer/provider action)
        env:
          V4_AUTH_TEST_ORIGIN: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: https://cpmmgivhlkfbiwzhlcey.supabase.co
          V4_AUTH_QA_EMAIL: ${{ secrets.SERVICEDESK_QA_TEST_EMAIL }}
          V4_AUTH_QA_PASSWORD: ${{ secrets.SERVICEDESK_QA_TEST_PASSWORD }}
          V4_AUTH_QA_WORKSPACE: ${{ secrets.SERVICEDESK_QA_TEST_WORKSPACE }}
          V4_AUTH_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          V4_AUTH_OUTPUT: ${{ runner.temp }}/private-signed-in-sidebar
        run: node scripts/release/v4-authenticated-sidebar-chrome.mjs
      - name: Retain PRIVATE fictional QA screenshots for one day
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: private-v4-authenticated-studio-${{ github.sha }}
          path: ${{ runner.temp }}/private-signed-in-sidebar/
          retention-days: 1
          if-no-files-found: error
