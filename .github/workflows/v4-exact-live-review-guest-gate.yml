name: ServiceDesk V4 exact LIVE Render review guest/health gate
# Isolated review branch push runs this gate. Render autoDeploy is OFF, so
# perform a short readiness retry and fail closed when an authorized manual
# promotion has not yet happened. Re-run the same SHA's failed job after
# promotion; do not waste a full CI cycle polling for an unscheduled deploy.
# No signed-in sessions, provider sends, DB queries or customer mutations.
on:
  push:
    branches: [deploy/servicedesk-v3-public-review-20261011]
permissions:
  contents: read
concurrency:
  group: servicedesk-v4-live-review-proof
  cancel-in-progress: false
jobs:
  verified-deployed-review:
    if: github.ref == 'refs/heads/deploy/servicedesk-v3-public-review-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact review commit
        uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Node 22
        uses: actions/setup-node@v4
        with: {node-version: 22.23.2}
      - name: Syntax check read-only proof
        run: node --check scripts/release/v4-review-exact-sha-guest-gate.mjs
      - name: Check exact Render review promotion, with bounded cold-start retry
        shell: bash
        run: |
          for i in $(seq 1 6); do
            if curl -fsS --max-time 12 https://servicedesk-v3-frontend-review.onrender.com/health \
                | node -e '
                  let raw="";
                  process.stdin.on("data", chunk => raw+=chunk);
                  process.stdin.on("end", () => {
                    try {
                      const j=JSON.parse(raw);
                      process.exit(j.ok===true && j.status==="live" &&
                        j.sourceProvider==="render" && j.sourceSha===process.env.GITHUB_SHA ? 0 : 1);
                    } catch { process.exit(1); }
                  });' ; then
              echo "Exact deployed review SHA is LIVE"
              break
            fi
            if [ "$i" -eq 6 ]; then
              echo "Manual Render review promotion never reached this SHA; rerun this same pinned-SHA job only after the authorized Render deploy is LIVE" >&2
              exit 1
            fi
            sleep 8
          done
      - name: Verify deployed source SHA and guest-route denial
        run: node scripts/release/v4-review-exact-sha-guest-gate.mjs
      - name: Retain redacted exact deployed release evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v4-exact-live-review-guest-${{ github.sha }}
          path: ${{ runner.temp }}/servicedesk-v4-live-review-gate.json
          if-no-files-found: error
          retention-days: 7
