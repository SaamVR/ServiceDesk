name: ServiceDesk V3 pricing claim RC
on:
  pull_request:
    branches:
      - feat/servicedesk-v3-combined-acceptance-20261011
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/features/product/ProductSections.tsx"
      - "src/features/product/StaticProductPage.tsx"
      - "src/app/globals.css"
      - "tests/e2e/v3-pricing-claim-truth.test.ts"
      - ".github/workflows/v3-pricing-claim-rc.yml"
permissions:
  contents: read
concurrency:
  group: servicedesk-v3-pricing-claim-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pricing-and-full-rc:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify marketing pricing claim boundaries
        run: pnpm exec vitest run tests/e2e/v3-pricing-claim-truth.test.ts
      - name: Complete repository release checks
        run: pnpm check:rc
