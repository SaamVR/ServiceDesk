name: ServiceDesk V4 service catalog setup readiness CI
on:
  push:
    branches: [fix/v4-zero-catalog-quoting-readiness-20261012]
  pull_request:
    branches: [feat/servicedesk-v4-reconciled-qa-shell-20261012]
    paths:
      - src/features/operations/CatalogReadinessBanner.tsx
      - src/features/operations/OperationalProductRoute.tsx
      - src/features/operations/StaffOverviewDashboard.tsx
      - tests/e2e/v4-catalog-quote-readiness.test.tsx
      - .github/workflows/v4-catalog-readiness-rc.yml
permissions:
  contents: read
concurrency:
  group: servicedesk-v4-catalog-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  exact-head-rc:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.2, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/e2e/v4-catalog-quote-readiness.test.tsx
      - run: pnpm check:rc
