name: ServiceDesk V4 authenticated real snapshot negative gate source proof
on:
  push:
    branches: [feat/servicedesk-v4-authenticated-data-proof-20261012]
permissions:
  contents: read
jobs:
  guard-source:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@v4
        with: {version: 10.17.1,run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.2, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: node --check scripts/release/v4-authenticated-sidebar-chrome.mjs
      - run: pnpm exec vitest run tests/e2e/v4-authenticated-13-route-acceptance-contract.test.ts tests/e2e/v4-studio-sidebar-visibility.test.ts
      - run: pnpm typecheck
