name: ServiceDesk V4 AI navigation acceptance
on:
  push:
    branches: [feat/v4-ai-first-class-navigation-20261012]
  pull_request:
    branches: [feat/servicedesk-v4-reconciled-qa-shell-20261012]
    paths:
      - "src/components/product/StaffAppShell.tsx"
      - "src/features/operations/staff-modules.ts"
      - "tests/e2e/staff-v3-navigation.test.tsx"
      - ".github/workflows/v4-ai-navigation-rc.yml"
permissions:
  contents: read
concurrency:
  group: servicedesk-v4-ai-navigation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  navigation-acceptance:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.2, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Sidebar, staff navigation and AI workspace source acceptance
        run: pnpm exec vitest run tests/e2e/staff-v3-navigation.test.tsx tests/e2e/v4-studio-sidebar-visibility.test.ts tests/e2e/v4-ai-request-copilot.test.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
