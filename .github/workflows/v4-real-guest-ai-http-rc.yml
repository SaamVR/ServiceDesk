name: ServiceDesk V4 guest staff AI real HTTP regression
on:
  push:
    branches: [fix/v4-guest-staff-ai-http-real-rc-20261013]
  pull_request:
    branches: [feat/servicedesk-v4-reconciled-qa-shell-20261012]
permissions:
  contents: read
concurrency:
  group: sd-v4-guest-ai-http-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  real-built-next-guest-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Full source RC for owned branch
        if: github.event_name == 'push'
        run: pnpm check:rc
      - name: Build for PR real-HTTP run
        if: github.event_name == 'pull_request'
        run: pnpm build
      - name: Start exact built Next on localhost
        run: |
          pnpm start -H 127.0.0.1 -p 3000 > "$RUNNER_TEMP/v4-guest-ai-server.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Server did not start" >&2
          exit 1
      - name: Verify real HTTP guest and staff AI denials
        env:
          V4_GUEST_ROUTE_ORIGIN: http://127.0.0.1:3000
        run: node scripts/release/v4-studio-guest-release-contract.mjs
