name: ServiceDesk V4 AI navigation language regression

on:
  push:
    branches: [fix/v4-ai-operator-language-contract-20261012]
  pull_request:
    branches: [feat/servicedesk-v4-reconciled-qa-shell-20261012]
    paths:
      - "tests/e2e/v2-operator-language.test.ts"
      - ".github/workflows/v4-ai-nav-language-rc.yml"

permissions:
  contents: read

jobs:
  language-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.2, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Operator-facing language and AI navigation compatibility
        run: pnpm exec vitest run tests/e2e/v2-operator-language.test.ts tests/e2e/staff-v3-navigation.test.tsx
      - run: pnpm typecheck
