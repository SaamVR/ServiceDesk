  native-pg17-f15-atomic:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-f15-no-real-user
          POSTGRES_DB: sd_f15_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sd_f15_disposable"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: sd_f15_disposable
      PGUSER: postgres
      PGPASSWORD: disposable-f15-no-real-user
      SERVICEDESK_F15_PG17_DISPOSABLE_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce disposable database and exact source head
        run: |
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "sd_f15_disposable"
          test "$SERVICEDESK_F15_PG17_DISPOSABLE_ONLY" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install isolated PG client if absent
        run: command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Create fictional baseline with NO pgcrypto, load reviewed V2 candidate
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/v4-f15-atomic-pg17-fixture-v2.sql
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "select count(*) from pg_extension where extname='pgcrypto';")" = "0"
          psql -X -v ON_ERROR_STOP=1 -f docs/engineering/security/f15-unanswered-lead-atomic-db-candidate-v2.sql
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "select count(*) from pg_extension where extname='pgcrypto';")" = "0"
      - name: Real PostgreSQL 17 ACL, rollback, two-tenant and replay checks
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/v4-f15-atomic-pg17-acceptance.sql
      - name: Twelve real concurrent claims and writer lock
        run: bash scripts/release/v4-f15-atomic-pg17-concurrency.sh

  native-pg17-f15-attention-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-f15-no-real-user
          POSTGRES_DB: sd_f15_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sd_f15_disposable"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: sd_f15_disposable
      PGUSER: postgres
      PGPASSWORD: disposable-f15-no-real-user
      SERVICEDESK_F15_PG17_DISPOSABLE_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact head and local-only database guard
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "sd_f15_disposable"
          test "$SERVICEDESK_F15_PG17_DISPOSABLE_ONLY" = "1"
      - name: Install PostgreSQL client
        run: command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Isolated fictional Attention Center, core SHA-256 V3 candidate
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/v4-f15-atomic-pg17-fixture-v3.sql
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "select count(*) from pg_extension where extname='pgcrypto';")" = "0"
          psql -X -v ON_ERROR_STOP=1 -f docs/engineering/security/f15-unanswered-lead-atomic-attention-v3.sql
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "select count(*) from pg_extension where extname='pgcrypto';")" = "0"
      - name: Real source journal plus attention lineage and forced rollback
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/v4-f15-atomic-pg17-acceptance-v3.sql
      - name: Twelve competing SLA claims plus message-writer lock
        run: bash scripts/release/v4-f15-atomic-pg17-concurrency.sh

  native-pg17-f26-atomic-crew:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-f26-no-real-user
          POSTGRES_DB: sd_f26_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sd_f26_disposable"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: sd_f26_disposable
      PGUSER: postgres
      PGPASSWORD: disposable-f26-no-real-user
      SERVICEDESK_F26_PG17_DISPOSABLE_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact source and disposable localhost guard
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "sd_f26_disposable"
          test "$SERVICEDESK_F26_PG17_DISPOSABLE_ONLY" = "1"
      - name: Install local PostgreSQL client
        run: command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Build fictional baseline and extract exact original 0011 RPC
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/v4-f26-atomic-crew-pg17-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/v4-f26-owner-jwt-pg17-auth-fixture.sql
          python3 -c 'from pathlib import Path; s=Path("supabase/migrations/0011_visit_field_runtime.sql").read_text(); i=s.index("create or replace function public.servicedesk_transition_visit(p_input jsonb)"); j=s.index("\n$$;",i)+4; Path("/tmp/f26-original-0011-rpc.sql").write_text(s[i:j]+"\n")'
          psql -X -v ON_ERROR_STOP=1 -f /tmp/f26-original-0011-rpc.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/engineering/security/f26-atomic-crew-assign-trigger-candidate-v1.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/engineering/security/f26-owner-role-atomic-assign-rpc-candidate.sql
      - name: Native PG17 rejected rows and original 0011 positive compatibility
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/v4-f26-atomic-crew-pg17-acceptance.sql
      - name: Real parallel membership revocation and ASSIGN row locks
        run: bash scripts/release/v4-f26-pg17-crew-revocation-race.sh
      - name: Source-only owner actor JWT spoof + role-revocation denial in PG17
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/v4-f26-owner-atomic-pg17-acceptance.sql
      - name: Real owner row revocation races before and after ASSIGN
        run: bash scripts/release/v4-f26-pg17-owner-revocation-race.sh

  native-pg17-f23-atomic-release:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-f23-no-real-user
          POSTGRES_DB: sd_f23_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sd_f23_disposable"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: sd_f23_disposable
      PGUSER: postgres
      PGPASSWORD: disposable-f23-no-real-user
      SERVICEDESK_F23_PG17_DISPOSABLE_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: F23 exact source SHA and isolated DB guard
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "sd_f23_disposable"
          test "$SERVICEDESK_F23_PG17_DISPOSABLE_ONLY" = "1"
      - name: Install disposable PostgreSQL client if unavailable
        run: command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Install fictional F23 test schema and review-only source candidate
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/v4-f23-atomic-hold-release-pg17-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/engineering/security/f23-atomic-hold-release-rpc-candidate.sql
      - name: Native F23 ACL, revocation, payment, quote, expiry and positive checks
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/v4-f23-atomic-hold-release-pg17-acceptance.sql
      - name: Native F23 two-session deposit-first and release-first quote row locking
        run: bash scripts/release/v4-f23-pg17-hold-payment-race.sh
      - name: Native F23 owner role revocation-first and release-first row locking
        run: bash scripts/release/v4-f23-pg17-owner-revocation-race.sh
