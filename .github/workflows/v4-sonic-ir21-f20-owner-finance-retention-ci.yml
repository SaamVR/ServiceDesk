name: ServiceDesk IR21 Owner journeys plus F15 atomic Inbox integration
on:
  push:
    branches: ["sonic-integration/ir21-f20-real-finance-retention-20261030"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: servicedesk-ir21-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  owner-finance-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Single focused owner journeys, F15 atomic ingress and exact-source critic
        run: >-
          pnpm exec vitest run
          tests/ai/f20-owner-ledger-entrypoint.test.ts
          tests/ai/f20-owner-retention-entrypoint.test.ts
          tests/ai/f20-independent-finance-retention-critic.test.ts
          tests/ai/f20-ir21-exact-source-critic.test.ts
          src/server/workflows/sonic-f15-atomic-ingress.ts
          src/server/workflows/sonic-f15-postgres-port.ts
          src/server/workflows/sonic-f15-unanswered-lead-sla.ts
          src/server/workflows/sonic-f15-complete-saved-source.ts
          src/server/workflows/sonic-f15-owner-manual-escalation.ts
          src/features/operations/f15-owner-lead-sla-action.ts
          src/features/operations/OwnerUnansweredLeadReview.tsx
          src/features/operations/InboxProtectedLeadReviewPanel.tsx
          src/app/app/\[workspace\]/inbox/page.tsx
          tests/ai/sonic-f15-owner-manual-journey.test.ts
          tests/ai/sonic-f15-complete-source-reader.test.ts
          tests/ai/sonic-f15-integrated-independent-critic.test.ts
          tests/ai/sonic-f15-unanswered-lead-sla.test.ts
          tests/ai/sonic-f15-atomic-ingress.test.ts
          tests/ai/sonic-f15-postgres-port.test.ts
          tests/ai/sonic-f15-ingress-independent-critic.test.ts
          tests/ai/sonic-f15-owner-manual-journey.test.ts
          tests/ai/sonic-f15-complete-source-reader.test.ts
          tests/ai/sonic-f15-integrated-independent-critic.test.ts
      - name: TypeScript
        run: pnpm typecheck
      - name: Changed-file lint
        run: >-
          pnpm exec eslint
          src/features/operations/f20-owner-finance-review-action.ts
          src/features/operations/OwnerLedgerExceptionReview.tsx
          src/features/operations/f20-owner-retention-review-action.ts
          src/features/operations/OwnerConsentedRetentionReview.tsx
          src/features/operations/F20OwnerSourceReviewGate.tsx
          src/app/app/\[workspace\]/invoices/page.tsx
          src/app/app/\[workspace\]/customers/page.tsx
          tests/ai/f20-owner-ledger-entrypoint.test.ts
          tests/ai/f20-owner-retention-entrypoint.test.ts
          tests/ai/f20-independent-finance-retention-critic.test.ts
          tests/ai/f20-ir21-exact-source-critic.test.ts
      - name: Source build only, no deployment
        run: pnpm build
