name: ServiceDesk P43 duplicate execution source critic
on:
  push:
    branches: [sonic-p03/p43-attention-execution-identity-20261029]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: servicedesk-p43-${{ github.ref }}
  cancel-in-progress: true
jobs:
  execution-identity-critic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/e2e/v4-p43-duplicate-attention-execution-identity.test.ts tests/e2e/v4-p43-source-lineage-critic.test.ts tests/e2e/v4-p41-owner-attention-zoned-clock.test.ts tests/e2e/v4-p33-owner-attention-triage.test.ts
      - run: pnpm typecheck
