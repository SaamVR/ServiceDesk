name: ServiceDesk V4 owner pricing exact-name proof
on:
  push:
    branches: [fix/v4-pricing-name-idempotency-20261012]
  pull_request:
    branches: [feat/servicedesk-v4-reconciled-qa-shell-20261012]
    paths:
      - "supabase/migrations/0061_v4_owner_first_run_pricing.sql"
      - "src/server/core/owner-cleaning-pricing-setup.ts"
      - "tests/e2e/v4-owner-first-run-pricing.test.ts"
      - ".github/workflows/v4-owner-price-name-readback-rc.yml"
permissions:
  contents: read
concurrency:
  group: v4-owner-price-readback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  exact-head-rc:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.2, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/e2e/v4-owner-first-run-pricing.test.ts
      - run: pnpm check:rc
