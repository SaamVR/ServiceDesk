name: ServiceDesk V4 live portal crew booking and onboarding guest Chrome
on:
  push:
    branches: [feat/servicedesk-v4-portal-crew-guest-audit-20261012]
permissions:
  contents: read
jobs:
  live-extended-guest:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.2}
      - name: Source parse guard
        run: node --check scripts/release/v4-portal-crew-guest-chrome.mjs
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Validate current Render exact source is the reviewed release
        shell: bash
        run: |
          curl -fsS --max-time 25 https://servicedesk-v3-frontend-review.onrender.com/health |
          node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const j=JSON.parse(s);if(!j.ok||j.sourceProvider!=="render"||j.sourceSha!=="9a240096bd1961c8ef4bda002747bc64fd2c4882")process.exit(1);console.log("Published source verified")})'
      - name: Browser audit 18 routes by 7 breakpoints, no privileged account or actions
        env:
          V4_GUEST_EXTENDED_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          V4_GUEST_EXTENDED_OUTPUT: ${{ runner.temp }}/v4-live-ext-guest
          V4_GUEST_EXTENDED_ORIGIN: https://servicedesk-v3-frontend-review.onrender.com
        run: node scripts/release/v4-portal-crew-guest-chrome.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-render-portal-crew-guest-${{ github.sha }}
          path: ${{ runner.temp }}/v4-live-ext-guest/
          if-no-files-found: warn
          retention-days: 4
