name: ServiceDesk V4 controlled persisted automation RC
on:
  push:
    branches: [feat/v4-controlled-request-workflow-execution-20261012]
  pull_request:
    branches: [feat/servicedesk-v4-reconciled-qa-shell-20261012]
    paths:
      - src/server/workflows/owner-request-automation.ts
      - src/features/operations/OperationalProductRoute.tsx
      - tests/db/v4-owner-request-automation.test.ts
      - tests/e2e/v4-request-workflow-owner-action.test.ts
      - .github/workflows/v4-controlled-request-workflow-rc.yml
permissions:
  contents: read
concurrency:
  group: sd-v4-controlled-request-workflow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  exact-head-rc:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.2, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/db/v4-owner-request-automation.test.ts tests/e2e/v4-request-workflow-owner-action.test.ts tests/domain/v2-workflow-engine.test.ts
      - name: Full source validation on specialist push (canonical PR full RC covers every PR)
        if: github.event_name == 'push'
        run: pnpm check:rc
