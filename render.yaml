services:
  - type: web
    runtime: node
    name: servicedesk-v2-rc
    repo: https://github.com/SaamVR/ServiceDesk
    branch: feat/servicedesk-v2-multilane-20261006
    region: virginia
    plan: free
    autoDeployTrigger: off
    buildCommand: corepack enable && corepack prepare pnpm@10.17.1 --activate && pnpm install --frozen-lockfile && pnpm check:rc
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SERVICEDESK_EMAIL_WEBHOOK_SECRET
        sync: false
      - key: SERVICEDESK_EMAIL_ACCOUNT_WORKSPACE_MAP
        sync: false
      - key: SERVICEDESK_VOICE_WEBHOOK_SECRET
        sync: false
      - key: SERVICEDESK_VOICE_ACCOUNT_WORKSPACE_MAP
        sync: false
      - key: SERVICEDESK_EMAIL_INBOUND_PROOF_JSON
        sync: false
      - key: SERVICEDESK_VOICE_INBOUND_PROOF_JSON
        sync: false
      - key: SERVICEDESK_REQUEST_PHOTO_BUCKET
        sync: false
      - key: SERVICEDESK_REQUEST_PHOTO_RETENTION_DAYS
        sync: false
      - key: SERVICEDESK_CANONICAL_RC_RECEIPT
        sync: false
      - key: SERVICEDESK_CANONICAL_RC_BUILD_SHA
        sync: false
      - key: SERVICEDESK_BROWSER_ACCEPTANCE_RECEIPT
        sync: false
      - key: SERVICEDESK_BROWSER_ACCEPTANCE_BUILD_SHA
        sync: false
      - key: SERVICEDESK_STAFF_BROWSER_ACCEPTANCE_RECEIPT
        sync: false
      - key: SERVICEDESK_STAFF_BROWSER_ACCEPTANCE_BUILD_SHA
        sync: false
      - key: SERVICEDESK_MIGRATION_REHEARSAL_RECEIPT
        sync: false
      - key: SERVICEDESK_MIGRATION_REHEARSAL_BUILD_SHA
        sync: false
